name: Build

# Every push and pull request builds the app. Pushing a v* tag also publishes the
# self-contained win-x64 zip as a GitHub release, using .github/release-notes/<tag>.md.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "HelpDesk Pro Tools.csproj" -c Release

      - name: Publish self-contained
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish "HelpDesk Pro Tools.csproj" -c Release -r win-x64 --self-contained true -o publish

      - name: Zip and create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "HelpDeskProTools-$tag-win-x64-self-contained.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          gh release create $tag $zip --title "HelpDesk Pro Tools $tag" --notes-file ".github/release-notes/$tag.md"
