name: Build

# Every push and pull request builds the app. A push to main whose <Version> has no
# release yet (or a pushed v* tag) also publishes the self-contained win-x64 zip as a
# GitHub release, using .github/release-notes/v<version>.md.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "HelpDesk Pro Tools.csproj" -c Release

      - name: Decide whether to release
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $version = ([xml](Get-Content "HelpDesk Pro Tools.csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag is already released"; exit 0 }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # gh's "not found" exit code would otherwise fail the step.
          exit 0

      - name: Publish self-contained
        if: steps.release.outputs.tag != ''
        run: dotnet publish "HelpDesk Pro Tools.csproj" -c Release -r win-x64 --self-contained true -o publish

      - name: Zip and create release
        if: steps.release.outputs.tag != ''
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $zip = "HelpDeskProTools-$tag-win-x64-self-contained.zip"
          Compress-Archive -Path publish\* -DestinationPath $zip
          gh release create $tag $zip --target "${{ github.sha }}" --title "HelpDesk Pro Tools $tag" --notes-file ".github/release-notes/$tag.md"
